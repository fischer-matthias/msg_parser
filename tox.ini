[tox]
envlist = py39, py310, py311, py312, py313, flake8

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313, flake8

[testenv:flake8]
basepython = python
deps = flake8
commands = flake8 msg_parser

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    -r{toxinidir}/requirements_dev.txt
extras =
    html
    rtf
commands =
    pytest --basetemp={envtmpdir}
